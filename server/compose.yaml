name: squadvoice

x-service: &service
  platform: linux/amd64
  restart: unless-stopped
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,mode=1777
  logging:
    driver: local
    options:
      max-size: "5m"
      max-file: "3"

services:
  media:
    <<: *service
    image: ${SQUADVOICE_IMAGE_PREFIX:-squadvoice}-media:${SQUADVOICE_IMAGE_TAG:-local}
    environment:
      SQUADVOICE_PUBLIC_IPV4: ${SQUADVOICE_PUBLIC_IPV4:?Set SQUADVOICE_PUBLIC_IPV4 in .env}
      GOMEMLIMIT: 360MiB
    cap_add: [NET_ADMIN, SETPCAP, SETUID, SETGID]
    mem_limit: 512m
    volumes:
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "/squadvoice", "media-health"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    <<: *service
    image: ${SQUADVOICE_IMAGE_PREFIX:-squadvoice}-backend:${SQUADVOICE_IMAGE_TAG:-local}
    network_mode: "service:media"
    depends_on:
      media:
        condition: service_healthy
        restart: true
    environment:
      SQUADVOICE_HOST: ${SQUADVOICE_HOST:?Set SQUADVOICE_HOST in .env}
      SQUADVOICE_OWNER: ${SQUADVOICE_OWNER:-}
      ClientUdtCHK: ${ClientUdtCHK:-false}
      GOMEMLIMIT: 200MiB
      cachesize: ${cachesize:-10240}
    mem_limit: 320m
    volumes:
      - ./config:/config:ro
      - accounts:/data
      - sockets:/run/squadvoice
    healthcheck:
      test: ["CMD", "/squadvoice", "admin", "status"]
      interval: 15s
      timeout: 8s
      retries: 4

  edge:
    <<: *service
    image: ${SQUADVOICE_IMAGE_PREFIX:-squadvoice}-edge:${SQUADVOICE_IMAGE_TAG:-local}
    profiles: [public]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SQUADVOICE_HOST: ${SQUADVOICE_HOST:?Set SQUADVOICE_HOST in .env}
      SQUADVOICE_ACME_PROFILE: ${SQUADVOICE_ACME_PROFILE:-shortlived}
    cap_add: [NET_BIND_SERVICE, DAC_OVERRIDE]
    mem_limit: 192m
    volumes:
      - sockets:/run/squadvoice:ro
      - certificates:/data
    ports:
      - "80:80/tcp"
      - "443:443/tcp"

  tools:
    <<: *service
    profiles: [tools]
    image: ${SQUADVOICE_IMAGE_PREFIX:-squadvoice}-backend:${SQUADVOICE_IMAGE_TAG:-local}
    restart: "no"
    network_mode: none
    user: "0:0"
    cap_add: [DAC_OVERRIDE]
    volumes:
      - ./config:/config

volumes:
  accounts:
  sockets:
  certificates:
