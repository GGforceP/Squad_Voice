name: Docker images

on:
  push:
    branches: [docker]
  pull_request:
    branches: [docker]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the versioned images to GHCR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/docker'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check public source
        run: node scripts/Check-PublicTree.mjs
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Run server tests
        working-directory: server
        run: go test ./...

  images:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [backend, media, edge]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch verified application dependencies
        if: matrix.target != 'backend'
        run: sh server/deploy/fetch-deps.sh
      - name: Authenticate to GHCR
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/docker' && inputs.publish
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build container image
        env:
          TARGET: ${{ matrix.target }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/docker' && inputs.publish }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          test -n "$version"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-$TARGET:$version"
          set -- --platform linux/amd64 --target "$TARGET" -f server/Dockerfile -t "$image"
          set -- "$@" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          set -- "$@" --label "org.opencontainers.image.version=$version" --label "org.opencontainers.image.revision=$GITHUB_SHA"
          if [ "$PUBLISH" = 'true' ]; then
            docker buildx build "$@" --push .
          else
            docker buildx build "$@" --load .
          fi
