name: Windows installer

on:
  push:
    branches: [installer]
  pull_request:
    branches: [installer]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this installer as a GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/installer'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check public source
        run: node scripts/Check-PublicTree.mjs
      - name: Build and hash installer
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Get-BuildDeps.ps1 -SkipLiveKit
          ./scripts/Build-Windows.ps1 -StageDirectory (Join-Path $env:RUNNER_TEMP 'squad-voice-build') -ArtifactDirectory './dist'
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          $name = "Squad.Voice.$version.x64.Setup.exe"
          Rename-Item -LiteralPath "dist/Squad Voice $version x64 Setup.exe" -NewName $name
          $hash = (Get-FileHash -LiteralPath (Join-Path 'dist' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath 'dist/SHA256SUMS' -Encoding utf8
          Copy-Item -LiteralPath 'VERSION' -Destination 'dist/VERSION'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/installer' && inputs.publish
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64
          path: dist
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath 'dist/VERSION' -Raw).Trim()
          gh release create "v$version" "dist/Squad.Voice.$version.x64.Setup.exe" 'dist/SHA256SUMS' --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Squad Voice $version" --generate-notes
          exit $LASTEXITCODE
